<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Approvazione utenti • ICON RECOMP</title>
<style>
body{font-family:Arial,sans-serif;background:#080a0d;color:#f1f5f9;margin:0;padding:24px}.box{max-width:900px;margin:auto;background:#141922;border:1px solid #293241;border-radius:18px;padding:24px}h1{margin-top:0}.muted{color:#94a3b8;font-size:14px}.row{display:flex;justify-content:space-between;gap:16px;align-items:center;background:#0e1217;border:1px solid #293241;border-radius:12px;padding:14px;margin:10px 0;flex-wrap:wrap}button{border:0;border-radius:9px;padding:10px 14px;font-weight:bold;cursor:pointer}.approve{background:#10b981;color:#001b12}.revoke{background:#7f1d1d;color:#fecaca}.refresh,.login{background:#334155;color:white}#msg{margin:12px 0;color:#34d399}.status{font-size:12px;padding:5px 8px;border-radius:8px;background:#78350f;color:#fde68a}.ok{background:#064e3b;color:#a7f3d0}
</style></head><body>
<div class="box"><h1>Gestione approvazioni</h1><p class="muted">Accesso riservato a lucabottiglieri94@gmail.com. Qui puoi approvare o revocare gli utenti registrati.</p><button class="login" id="login">Accedi con Google</button><button class="refresh" id="refresh" style="display:none">Aggiorna lista</button><div id="msg"></div><div id="list"></div></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js';
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js';
import{getFirestore,collectionGroup,getDocs,updateDoc,deleteDoc}from'https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js';
const config={apiKey:'AIzaSyAdZbBv6JYbYnl6CxuFVfHhSftvIxwf2DY',authDomain:'budget-luca.firebaseapp.com',projectId:'budget-luca',storageBucket:'budget-luca.firebasestorage.app',messagingSenderId:'67496424698',appId:'1:67496424698:web:efc07408543'};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();const ADMIN='lucabottiglieri94@gmail.com';const msg=document.getElementById('msg'),list=document.getElementById('list');const say=t=>msg.textContent=t;
async function load(){list.innerHTML='<p class="muted">Caricamento utenti...</p>';say('');try{const snap=await getDocs(collectionGroup(db,'gym_recomp'));const docs=snap.docs.filter(d=>d.id==='current_state');if(docs.length===0){list.innerHTML='<p class="muted">Nessun utente trovato.</p>';return}list.innerHTML='';docs.forEach(stateDoc=>{const data=stateDoc.data()||{};const parts=stateDoc.ref.path.split('/');const uid=parts[1]||'UID non disponibile';const approved=data.approved===true;const row=document.createElement('div');row.className='row';row.innerHTML=`<div><b>${data.name||data.displayName||'Nome non impostato'}</b><div class="muted">UID: ${uid}</div></div><div><span class="status ${approved?'ok':''}">${approved?'APPROVATO':'IN ATTESA'}</span> <button class="${approved?'revoke':'approve'}" data-act="toggle">${approved?'Revoca':'Approva'}</button> <button class="revoke" data-act="delete">${approved?'Elimina':'Rifiuta'}</button></div>`;row.querySelector('[data-act="toggle"]').onclick=async()=>{try{const value=!approved;await updateDoc(stateDoc.ref,{approved:value,approvalUpdatedAt:Date.now()});say(value?'Utente approvato correttamente.':'Approvazione revocata.');await load()}catch(e){say('Errore aggiornamento: '+e.message)}};row.querySelector('[data-act="delete"]').onclick=async()=>{if(!confirm(`Eliminare definitivamente la richiesta di "${data.name||data.displayName||uid}"? L'operazione non è reversibile.`))return;try{await deleteDoc(stateDoc.ref);say('Richiesta eliminata.');await load()}catch(e){say('Errore eliminazione: '+e.message)}};list.appendChild(row)})}catch(e){list.innerHTML='';say('Errore caricamento: '+e.message);console.error(e)}}
document.getElementById('login').onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){say('Errore login: '+e.message)}};document.getElementById('refresh').onclick=load;
onAuthStateChanged(auth,u=>{if(u&&u.email&&u.email.toLowerCase()===ADMIN){document.getElementById('login').style.display='none';document.getElementById('refresh').style.display='inline-block';say('Amministratore riconosciuto.');load()}else if(u){say('Account non autorizzato: '+u.email+'. Esci e accedi con '+ADMIN)}else{document.getElementById('login').style.display='inline-block';document.getElementById('refresh').style.display='none';say('Devi effettuare il login amministratore.')}});
</script></body></html>
